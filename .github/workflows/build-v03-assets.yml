name: Build v0.3 production assets

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/generate_v03_assets.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate Dwarven Forge v0.3 assets
        run: python .bootstrap/generate_v03_assets.py
      - name: Commit generated production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gui/v03
          git commit -m "Add Dwarven Forge v0.3 production assets"
          git push

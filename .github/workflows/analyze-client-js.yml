name: Analyze client JS

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/analyze_client_js.py'
      - 'docs/main.min.53XkBRxF.zip'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze minified client bundle
        run: python .bootstrap/analyze_client_js.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/client-js-layout-report.md
          git commit -m "Add client JS layout analysis report" || exit 0
          git push

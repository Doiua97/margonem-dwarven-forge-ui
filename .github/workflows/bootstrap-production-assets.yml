name: Build production assets

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/generate_assets.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate production PNG assets
        run: python .bootstrap/generate_assets.py
      - name: Remove temporary bootstrap files
        run: rm -rf .bootstrap .github/workflows/bootstrap-production-assets.yml
      - name: Commit production pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified Dwarven Forge production assets"
          git push

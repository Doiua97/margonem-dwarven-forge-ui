name: Build production assets

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/generate_assets.py'
      - '.github/workflows/bootstrap-production-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Patch tiny-frame handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.bootstrap/generate_assets.py')
          s=p.read_text()
          old="d.rectangle((2,2,w-3,h-3),outline=P['edge']); d.rectangle((4,4,w-5,h-5),outline=P['cu2'],width=2)"
          new="(w>=5 and h>=5) and d.rectangle((2,2,w-3,h-3),outline=P['edge']); (w>=9 and h>=9) and d.rectangle((4,4,w-5,h-5),outline=P['cu2'],width=2)"
          p.write_text(s.replace(old,new))
          PY
      - name: Generate production PNG assets
        run: python .bootstrap/generate_assets.py
      - name: Remove temporary bootstrap files
        run: rm -rf .bootstrap .github/workflows/bootstrap-production-assets.yml
      - name: Commit production pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified Dwarven Forge production assets"
          git push
